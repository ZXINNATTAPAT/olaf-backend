[phases.setup]
nixPkgs = ["python311", "curl", "gcc"]

[phases.install]
cmds = [
  # Use symlinks instead of copies to save space (~50% smaller venv)
  "python -m venv /opt/venv",
  # Install Rust toolchain (required for django-bolt)
  "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal",
  # Install Python packages
  "bash -c 'source $HOME/.cargo/env && export PATH=\"$HOME/.cargo/bin:/opt/venv/bin:$PATH\" && /opt/venv/bin/pip install --upgrade pip && /opt/venv/bin/pip install --no-cache-dir -r requirements.txt'",
  # Clean up Rust toolchain after building django-bolt (saves ~800MB-1GB)
  # Also clean up profile scripts that reference cargo to avoid warnings
  "rm -rf $HOME/.rustup $HOME/.cargo /root/.rustup /root/.cargo 2>/dev/null || true",
  "sed -i \"s|.*cargo/env.*||g\" /root/.profile /root/.bashrc /root/.bash_profile 2>/dev/null || true",
  # Clean up pip cache and build artifacts
  "rm -rf /root/.cache/pip /tmp/pip-* /tmp/build /tmp/*.whl 2>/dev/null || true",
  # Clean up Python bytecode and __pycache__
  "find /opt/venv -type d -name __pycache__ -exec rm -r {} + 2>/dev/null || true",
  "find /opt/venv -name '*.pyc' -delete 2>/dev/null || true",
  "find /opt/venv -name '*.pyo' -delete 2>/dev/null || true",
  # Clean up documentation and test files from packages
  # IMPORTANT: Never remove Django's test module - it's required by rest_framework_simplejwt and other packages
  # Only remove test directories from non-Django packages
  "find /opt/venv -type d -name 'tests' -path '*/site-packages/*' -not -path '*/site-packages/django/*' -not -path '*/site-packages/django/test*' -exec rm -r {} + 2>/dev/null || true",
  "find /opt/venv -type d -name 'test' -path '*/site-packages/*' -not -path '*/site-packages/django/*' -not -path '*/site-packages/django/test*' -exec rm -r {} + 2>/dev/null || true",
  "find /opt/venv -name '*.md' -delete 2>/dev/null || true",
  "find /opt/venv -name '*.txt' -path '*/tests/*' -not -path '*/site-packages/django/*' -delete 2>/dev/null || true",
  # Clean up locale files from non-Django packages (saves ~5-10MB)
  # IMPORTANT: Never remove Django's locale files - Django requires them even if USE_I18N=False
  # Only remove locale files from other packages that don't need them
  "find /opt/venv -type d -name 'locale' -path '*/site-packages/*' -not -path '*/site-packages/django/*' -exec rm -r {} + 2>/dev/null || true",
  # Clean up example and sample files
  "find /opt/venv -name '*.example' -delete 2>/dev/null || true",
  "find /opt/venv -name '*.sample' -delete 2>/dev/null || true",
  # Clean up .git directories from packages
  "find /opt/venv -type d -name '.git' -exec rm -r {} + 2>/dev/null || true",
  # Clean up unnecessary static files (keep only essential for Swagger/DRF)
  "find /opt/venv -path '*/rest_framework/static/rest_framework/css/*' ! -name 'bootstrap*' -delete 2>/dev/null || true",
  "find /opt/venv -path '*/rest_framework/static/rest_framework/js/*' ! -name '*.min.js' -delete 2>/dev/null || true",
  # In production, remove staticfiles directory after build (if ENABLE_STATIC_FILES is False)
  # This is handled by environment variable - staticfiles won't be collected if disabled
  "rm -rf /app/staticfiles 2>/dev/null || true"
]

