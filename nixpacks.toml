[phases.setup]
nixPkgs = ["python310", "curl", "gcc"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable",
  "bash -c 'source $HOME/.cargo/env && export PATH=\"$HOME/.cargo/bin:/opt/venv/bin:$PATH\" && rustc --version && cargo --version && /opt/venv/bin/pip install --upgrade pip && /opt/venv/bin/pip install -r requirements.txt'"
]

